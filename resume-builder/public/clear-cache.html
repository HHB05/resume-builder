<!DOCTYPE html>
<html>
<head>
    <title>清除缓存 - 简历制作平台</title>
    <style>
        body {
            font-family: 'Noto Sans SC', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: #0f172a;
            color: white;
        }
        .container {
            text-align: center;
            padding: 40px;
            background: #1e293b;
            border-radius: 16px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        h1 { margin-bottom: 20px; font-size: 24px; }
        p { color: #94a3b8; margin-bottom: 20px; }
        button {
            padding: 12px 24px;
            font-size: 16px;
            background: linear-gradient(135deg, #f59e0b, #f97316);
            color: black;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin: 5px;
            font-weight: 600;
            transition: transform 0.2s;
        }
        button:hover { transform: scale(1.05); }
        .success { color: #10b981; margin-top: 20px; font-weight: 500; }
        .warning { color: #f59e0b; margin-top: 20px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🗑️ 清除浏览器缓存</h1>
        <p>点击下方按钮清除登录状态和缓存数据</p>
        <button onclick="clearAll()">清除所有缓存</button>
        <button onclick="goHome()">返回首页</button>
        <button onclick="goLogin()">去登录</button>
        <p id="message" class="success"></p>
        <p id="warning" class="warning"></p>
    </div>
    <script>
        function clearAll() {
            localStorage.clear();
            sessionStorage.clear();
            document.getElementById('message').textContent = '✅ 缓存已清除！';
            document.getElementById('warning').textContent = '现在点击"返回首页"或"去登录"按钮';
        }
        function goHome() {
            window.location.href = '/';
        }
        function goLogin() {
            window.location.href = '/login';
        }
    </script>
</body>
</html>
